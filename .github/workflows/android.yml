name: Android checks
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: exile-forge-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run UI checks on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.sperance.exileforge.test/androidx.test.runner.AndroidJUnitRunner | tee ui-results.txt
            python3 -c "import pathlib,re; text=pathlib.Path('ui-results.txt').read_text(); assert re.search(r'OK \(\d+ tests?\)', text), text"
            adb pull /sdcard/Android/data/com.sperance.exileforge/files/design design-preview
      - name: Upload UI reports and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exile-forge-ui
          path: |
            ui-results.txt
            design-preview
      - name: Preview image in verification log
        run: python3 -c "import base64,pathlib; print('DESIGN_IMAGE_START'); print(base64.b64encode(pathlib.Path('design-preview/arsenal.jpg').read_bytes()).decode()); print('DESIGN_IMAGE_END')"
