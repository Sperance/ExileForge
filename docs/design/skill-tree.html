 draw(){let s=`<rect x="${-ext*2}" y="${-ext*2}" width="${ext*4}" height="${ext*4}" fill="#0C1115"/>`;
  for(let g=-ext;g<=ext;g+=100)s+=`<line x1="${g}" y1="${-ext}" x2="${g}" y2="${ext}" stroke="#121b22" stroke-width="2"/><line y1="${g}" x1="${-ext}" y2="${g}" x2="${ext}" stroke="#121b22" stroke-width="2"/>`;
  const oct=([a,b])=>{const A=N[a],B=N[b],dx=B.x-A.x,dy=B.y-A.y,m=Math.min(Math.abs(dx),Math.abs(dy));
    const mx=A.x+Math.sign(dx)*m,my=A.y+Math.sign(dy)*m;return `M${f(A.x)},${f(A.y)} L${f(mx)},${f(my)} L${f(B.x)},${f(B.y)}`};
  E.forEach(e=>s+=`<path d="${oct(e)}" fill="none" stroke="${N[e[0]].tint}" stroke-width="9" stroke-linejoin="round" opacity="${isT(e)?1:.45}"/>`);
  E.forEach(e=>{if(isT(e))s+=`<path d="${oct(e)}" fill="none" stroke="#EEF8F1" stroke-width="3" stroke-dasharray="10 8"/>`});
  N.forEach(n=>{const t=taken.has(n.i),r=reach.has(n.i),rr=R[n.t];
   if(n.t==='NO')s+=`<rect x="${n.x-rr}" y="${n.y-rr*.6}" width="${rr*2}" height="${rr*1.2}" rx="${rr*.6}" fill="${t?'#EEF8F1':'#0C1115'}" stroke="${r||t?'#EEF8F1':'#7A8D99'}" stroke-width="5"/>`;
   else if(n.t==='KE'||n.t==='ST')s+=`<rect x="${n.x-rr*.8}" y="${n.y-rr*.8}" width="${rr*1.6}" height="${rr*1.6}" fill="${t?'#EEF8F1':'#0C1115'}" stroke="${n.t==='KE'?'#D24A43':n.tint}" stroke-width="6"/>`;
   else s+=`<circle cx="${n.x}" cy="${n.y}" r="${rr*.8}" fill="${t?'#EEF8F1':'#0C1115'}" stroke="${r||t?'#EEF8F1':n.tint}" stroke-width="4"/>`});
  return s}});
// 5 Пергамент
V.push({title:'5 · Карта на пергаменте',note:'Старая карта: связи — чернильные штрихи, узлы — сургучные печати, взятое обведено красным. Светлая сцена внутри тёмного приложения.',
 draw(){let s=`<defs><radialGradient id="pa"><stop offset="0" stop-color="#e9dcbc"/><stop offset=".8" stop-color="#cdb98c"/><stop offset="1" stop-color="#9b8358"/></radialGradient></defs>
  <rect x="${-ext*2}" y="${-ext*2}" width="${ext*4}" height="${ext*4}" fill="#2a2016"/><circle r="${ext*1.02}" fill="url(#pa)"/>`;
  for(let k=1;k<=4;k++)s+=`<circle r="${ext*k/4}" fill="none" stroke="#6b5434" stroke-width="2" stroke-dasharray="14 10" opacity=".4"/>`;
  starts.forEach(st=>{const a=Math.atan2(st.y,st.x);s+=`<text x="${f(ext*.9*Math.cos(a))}" y="${f(ext*.9*Math.sin(a))}" fill="#5a4326" font-size="64" font-style="italic" font-family="Georgia,serif" text-anchor="middle">${st.name}</text>`});
  E.forEach(e=>s+=line(N[e[0]],N[e[1]],isT(e)?'stroke="#9a1f1a" stroke-width="8"':'stroke="#4a3620" stroke-width="3.5" opacity=".75"'));
  N.forEach(n=>{const t=taken.has(n.i),r=reach.has(n.i);const wax=n.t==='KE'?'#7a1d18':n.t==='NO'?'#8a5a1e':n.t==='MA'?'#4e3a6a':n.t==='JE'?'#1f4a6a':n.t==='ST'?'#2e4f2e':'#6b5434';
   s+=shape(n,t?'#b8322a':wax,t?'#5a0f0c':r?'#2a1a0a':'#3b2a14',t?5:3)});
  return s}});
// ---------- витрина ----------
const wrap=document.getElementById('wrap'),views=[];
V.forEach((v,vi)=>{const el=document.createElement('div');el.className='variant';
 el.innerHTML=`<p class="vtitle">${v.title}</p><p class="vnote">${v.note}</p><div class="phone"><div class="top"><span>Очки: <b>12</b> · взято ${taken.size-1}</span><span class="zoom"><span data-z="0.7">＋</span><span data-z="1.4">−</span><span data-z="0">⤢</span></span></div>
 <svg class="map" viewBox="-450 -520 900 1040" preserveAspectRatio="xMidYMid meet" onload=""><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g class="art">${v.draw()}</g><g class="xs"></g><g class="hits">${N.map(hit).join('')}</g></svg>
 <div class="sheet"><div class="ty">Нажми на узел</div></div></div>`;
 wrap.appendChild(el);const svg=el.querySelector('svg'),sheet=el.querySelector('.sheet');let vb={x:-450,y:-520,w:900,h:1040};
 const set=()=>{svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);el.querySelectorAll('.lbl').forEach(t=>t.style.display=vb.w<700?'':'none')};
 const zoom=(k,cx=vb.x+vb.w/2,cy=vb.y+vb.h/2)=>{const w=Math.min(ext*2.4,Math.max(250,vb.w*k)),kk=w/vb.w;vb={x:cx-(cx-vb.x)*kk,y:cy-(cy-vb.y)*kk,w,h:vb.h*kk};set()};
 el.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const z=+b.dataset.z;if(z)zoom(z);else{vb={x:-ext,y:-ext*1.155,w:ext*2,h:ext*2.31};set()}});
 svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),cx=vb.x+(e.clientX-r.left)/r.width*vb.w,cy=vb.y+(e.clientY-r.top)/r.height*vb.h;zoom(e.deltaY<0?.85:1.18,cx,cy)},{passive:false});
 let drag=null;svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vb:{...vb},moved:false};svg.setPointerCapture(e.pointerId)});
 svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect(),k=Math.max(vb.w/r.width,vb.h/r.height),dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;vb={...vb,x:drag.vb.x-dx*k,y:drag.vb.y-dy*k};set()});
 svg.addEventListener('pointerup',e=>{const d=drag;drag=null;if(d&&!d.moved){const t=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('hit'));if(t)pick(+t.dataset.i)}});
 const pick=i=>{const n=N[i],st=taken.has(i)?'Взят':reach.has(i)?'Доступен':'Недоступен';
  sheet.innerHTML=`<div class="ty">${TYPE[n.t]} · ${st} · связей ${n.adj.length}</div><div class="nm">${n.name||n.code}</div><div class="ln">${n.code}</div>${reach.has(i)?'<span class="btn">Взять · 1 очко</span>':''}`;
  svg.querySelector('.sel')?.remove();svg.querySelector('.xs').insertAdjacentHTML('afterend',`<circle class="sel" cx="${n.x}" cy="${n.y}" r="${R[n.t]+16}" fill="none" stroke="#F2D03A" stroke-width="5" stroke-dasharray="8 6" pointer-events="none"/>`)};
 set();views.push(svg)});
document.getElementById('showX').onchange=e=>{const on=e.target.checked;views.forEach(svg=>{svg.querySelector('.xs').innerHTML=on?
  [...THRU].map(k=>line(N[E[k][0]],N[E[k][1]],'stroke="#ff3b3b" stroke-width="6" opacity=".9"')).join('')+X.map(([x,y])=>`<circle cx="${f(x)}" cy="${f(y)}" r="16" fill="none" stroke="#ff3b3b" stroke-width="6"/>`).join(''):''})};
</script>
</body>
