org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Кэш сборки и параллельные модули: неизменённое не пересобирается, независимые модули идут разом
org.gradle.caching=true
org.gradle.parallel=true
# Кэш конфигурации (4.3.1): граф задач не строится заново на каждом запуске; несовместимое с ним - предупреждение, не падение
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
