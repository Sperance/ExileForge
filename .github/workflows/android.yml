name: Android checks
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The obsolete 'tools' package is gone from the SDK repository; sdkmanager fails on it.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      # The release build is shrunk by R8, which removes what it cannot see being used; building it
      # here is what catches a serializer or a class R8 took away. The APK is not published.
      - run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: exile-forge-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run UI checks on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.sperance.exileforge.test/androidx.test.runner.AndroidJUnitRunner | tee ui-results.txt
            python3 -c "import pathlib,re; text=pathlib.Path('ui-results.txt').read_text(); assert re.search(r'OK \(\d+ tests?\)', text), text"
            adb pull /sdcard/Android/data/com.sperance.exileforge/files/design design-preview
      - name: Upload UI reports and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exile-forge-ui
          path: |
            ui-results.txt
            design-preview
      - name: Preview image in verification log
        run: python3 -c "import base64,pathlib; print('DESIGN_IMAGE_START'); print(base64.b64encode(pathlib.Path('design-preview/arsenal.jpg').read_bytes()).decode()); print('DESIGN_IMAGE_END')"
      - name: Hero preview in verification log
        run: python3 -c "import base64,pathlib; print('HERO_IMAGE_START'); print(base64.b64encode(pathlib.Path('design-preview/hero.jpg').read_bytes()).decode()); print('HERO_IMAGE_END')"
  client-server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Sperance/ktor-bestgame
          ref: 3bfd7dd8c38f8b47ae21a7d624234d546cdb929f
          path: backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew installDist
        working-directory: backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The obsolete 'tools' package is gone from the SDK repository; sdkmanager fails on it.
          packages: 'platform-tools'
      - name: Start isolated MongoDB
        # The backend pins mongodb://localhost:27017 in code, and its transactions need a replica set.
        run: |
          docker run -d --name client-mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec client-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec client-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec client-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify actual client and server contract
        run: python3 scripts/client_server_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-server-reports
          path: |
            core/build/reports/tests
            core/build/test-results
            build/client-server.log
