name: Android checks
on:
  push:
    # Правки только документации не собираются; RELEASE_NOTES.md нужен релизу - его правка запускает прогон
    paths:
      - '**'
      - '!**.md'
      - 'RELEASE_NOTES.md'
  pull_request:
  workflow_dispatch:

# Каждый job проверок в своей группе: новый пуш отменяет устаревший прогон, а начатую публикацию (job `release`) - нет.
jobs:
  # Что затронуто и будет ли релиз: от этого зависят тяжёлые job ниже.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-changes
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' }}
      release: ${{ steps.release.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          # core и закреплённый сервер: от них зависят тесты core и клиент-серверный контракт
          filters: |
            core:
              - 'core/**'
              - 'backend'
              - 'scripts/client_server_test.py'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/android.yml'
      # Релиз будет, если это пуш и у versionName ещё нет релиза: только тогда собираются R8-сборки и идёт эмулятор.
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "$GITHUB_EVENT_NAME" = push ] && ! gh release view "v$version" >/dev/null 2>&1; then pending=true; else pending=false; fi
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "v$version: release pending=$pending"

  core:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-core
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # The core builds against the server's `rules` module, checked out as the `backend/` submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true
          # Вся история сабмодуля: версию закреплённого сервера Gradle считает по коммитам backend/ (3.88.2)
          fetch-depth: 0
          # Сервер - приватный репозиторий (3.88.4): токен с Contents: read на ExileForge и ktor-bestgame; без секрета - токен прогона
          token: ${{ secrets.BACKEND_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Рабочая ветка не default: без этого кэш Gradle только читается, и каждый прогон собирает с нуля
          cache-read-only: false
          # Неиспользуемые файлы кэша удаляются перед сохранением: кэш не копится до лимита GitHub
          cache-cleanup: on-success
      - run: bash gradlew :core:ktlintCheck :core:test

  app:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-app
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.BACKEND_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The obsolete 'tools' package is gone from the SDK repository; sdkmanager fails on it.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success
      # Отладочной сборки нет нигде (4.12.x): lint - по релизному варианту, APK - только R8-сборки ниже
      - run: bash gradlew :app:ktlintCheck :app:lintRelease

  # Сжатые R8 сборки с инструментальным APK (4.12.x - единственные тестовые, отладочной нет): `-PuiTests` - для всех UI-тестов
  # (код приложения не ужат), без флага - строгий смоук R8 (4.3.1: единственная проверка R8).
  minified:
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-minified
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.BACKEND_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success
      - name: Build UI test APKs
        run: |
          bash gradlew :app:assembleMinifiedTest :app:assembleMinifiedTestAndroidTest -PuiTests
          mkdir -p ui-apks
          cp app/build/outputs/apk/minifiedTest/app-minifiedTest.apk ui-apks/app.apk
          cp app/build/outputs/apk/androidTest/minifiedTest/app-minifiedTest-androidTest.apk ui-apks/app-androidTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ui-apks
          path: ui-apks/*.apk
          if-no-files-found: error
          retention-days: 1
      - run: bash gradlew :app:assembleMinifiedTest :app:assembleMinifiedTestAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: ui-apks-minified
          path: |
            app/build/outputs/apk/minifiedTest/*.apk
            app/build/outputs/apk/androidTest/minifiedTest/*.apk
          if-no-files-found: error
          retention-days: 1

  # Подписанный релиз собирается один раз, здесь, и уходит в job `release` артефактом (4.3.1): там больше не пересобирают.
  release-apk:
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release-apk
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.BACKEND_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success
      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # A published APK is always signed with the release key, so each one installs over the last: no key, no release.
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then echo "::error::RELEASE_KEYSTORE secret is missing"; exit 1; fi
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          bash gradlew :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$signer" verify --print-certs "$apk" | tee signer.txt
          expected=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | sed -n 's/.*SHA256: *//p' | tr -d ':' | tr 'A-F' 'a-f')
          grep -qi "SHA-256 digest: $expected" signer.txt || { echo "::error::APK is not signed with the release key"; exit 1; }
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: exile-forge-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7

  # UI-тесты и смоук R8 - только перед релизом: собранные APK приходят артефактами, Gradle здесь не нужен.
  emulator:
    needs: [ changes, minified ]
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-emulator
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      API_LEVEL: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-apks
          path: ui-apks
      - uses: actions/download-artifact@v4
        with:
          name: ui-apks-minified
          path: app/build/outputs/apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      # Снимок загруженного эмулятора в кэше: прогон стартует из него, а не с холодной загрузки
      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-pixel_2
      - name: Create AVD snapshot
        if: ${{ steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"
      - name: Run UI checks on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r ui-apks/app.apk
            adb install -r ui-apks/app-androidTest.apk
            adb shell am instrument -w com.sperance.exileforge.test/androidx.test.runner.AndroidJUnitRunner | tee ui-results.txt
            python3 -c "import pathlib,re; text=pathlib.Path('ui-results.txt').read_text(); assert re.search(r'OK \(\d+ tests?\)', text), text"
            adb pull /sdcard/Android/data/com.sperance.exileforge/files/design design-preview
            # Сборка UI-тестов и строгая R8 - разные APK одного пакета: ставим начисто
            adb uninstall com.sperance.exileforge.test
            adb uninstall com.sperance.exileforge
            adb install -r app/build/outputs/apk/minifiedTest/app-minifiedTest.apk
            adb install -r app/build/outputs/apk/androidTest/minifiedTest/app-minifiedTest-androidTest.apk
            adb shell am instrument -w -e class com.sperance.exileforge.ui.ReleaseSmokeTest com.sperance.exileforge.test/androidx.test.runner.AndroidJUnitRunner | tee release-smoke.txt
            python3 -c "import pathlib; text=pathlib.Path('release-smoke.txt').read_text(); assert 'OK (1 test)' in text, text"
      - name: Upload UI reports and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exile-forge-ui
          path: |
            ui-results.txt
            release-smoke.txt
            design-preview
      - name: Preview image in verification log
        run: python3 -c "import base64,pathlib; print('DESIGN_IMAGE_START'); print(base64.b64encode(pathlib.Path('design-preview/arsenal.jpg').read_bytes()).decode()); print('DESIGN_IMAGE_END')"
      - name: Hero preview in verification log
        run: python3 -c "import base64,pathlib; print('HERO_IMAGE_START'); print(base64.b64encode(pathlib.Path('design-preview/hero.jpg').read_bytes()).decode()); print('HERO_IMAGE_END')"
      - name: Narrow screen preview in verification log
        run: python3 -c "import base64,pathlib; print('NARROW_IMAGE_START'); print(base64.b64encode(pathlib.Path('design-preview/narrow.jpg').read_bytes()).decode()); print('NARROW_IMAGE_END')"

  client-server:
    needs: changes
    # Контракт зависит от core и закреплённого сервера; перед релизом - всегда
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-client-server
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # The server under test is the pinned `backend/` submodule: its HEAD is the generated `SERVER_COMMIT`.
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.BACKEND_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success
      - run: bash gradlew installDist
        working-directory: backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Start isolated MongoDB
        # The backend pins mongodb://localhost:27017 in code, and its transactions need a replica set.
        run: |
          # Docker Hub режет анонимные скачивания (toomanyrequests) - образ берётся с зеркала Google, с повтором
          image=mirror.gcr.io/library/mongo:8.0
          for attempt in 1 2 3; do docker pull "$image" && break; sleep $((attempt * 10)); done
          docker run -d --name client-mongo -p 27017:27017 "$image" --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec client-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec client-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec client-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify actual client and server contract
        run: python3 scripts/client_server_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-server-reports
          path: |
            core/build/reports/tests
            core/build/test-results
            build/client-server.log

  # After all checks pass on a push, a versionName with no release yet is published (3.68.2): tag v<versionName> on this
  # commit, the release APK from `release-apk` attached, the notes from RELEASE_NOTES.md (3.69.0).
  # Пропущенные по фильтру проверки (core без изменений) релиз не держат; упавшие или отменённые - держат.
  release:
    needs: [ changes, core, app, minified, release-apk, emulator, client-server ]
    if: ${{ !cancelled() && needs.changes.outputs.release == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      # Publishing needs write access: the RELEASE_TOKEN secret (a token with Contents: write) if set, else the workflow
      # token — which works only when Settings → Actions → General → Workflow permissions is «Read and write».
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      # Публикации нужны только заметки, версии и ревизии из исходников: без истории, сборка - артефакт job `release-apk`.
      - uses: actions/checkout@v4
        with:
          submodules: true
          # Сервер - приватный репозиторий (3.88.4): токен с Contents: read на ExileForge и ktor-bestgame; без секрета - токен прогона
          token: ${{ secrets.BACKEND_TOKEN || github.token }}
      - id: version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: exile-forge-release
          path: app/build/outputs
      - if: steps.version.outputs.exists == 'false'
        name: Publish release
        run: |
          tag=${{ steps.version.outputs.tag }}
          apk="ExileForge-$tag.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # The notes: RELEASE_NOTES.md holds only this version's, under its first heading «## <versionName>».
          heading=$(grep -m1 '^## ' RELEASE_NOTES.md | sed 's/[[:space:]]*$//')
          [ "$heading" = "## ${tag#v}" ] || { echo "::error::RELEASE_NOTES.md first heading is '$heading', not '## ${tag#v}'"; exit 1; }
          # update.json (3.72.0): what the app's updater reads — the build, the wire and rules it speaks, the APK and its SHA-256.
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          api=$(sed -n 's/^const val API_REVISION = \([0-9]*\).*/\1/p' core/src/main/kotlin/com/sperance/exileforge/core/model/sync/Sync.kt)
          rules=$(sed -n 's/^const val RULES_VERSION = \([0-9]*\).*/\1/p' backend/rules/src/main/kotlin/com/sperance/exileforge/rules/content/Content.kt)
          [ -n "$code" ] && [ -n "$api" ] && [ -n "$rules" ] || { echo "::error::update.json: versionCode '$code', API '$api' or rules '$rules' not found"; exit 1; }
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c %s "$apk")
          # Заметки релиза (3.86.0) - тело RELEASE_NOTES.md под заголовком: сборки берутся с GitHub, сервер их больше не дописывает.
          CODE="$code" NAME="${tag#v}" API="$api" RULES="$rules" APK="$apk" SIZE="$size" SHA="$sha" python3 -c '
          import json, os
          notes = open("RELEASE_NOTES.md", encoding="utf-8").read().split("\n", 1)[1].strip()
          e = os.environ
          print(json.dumps({"versionCode": int(e["CODE"]), "versionName": e["NAME"], "apiRevision": int(e["API"]), "rules": int(e["RULES"]),
                            "apk": e["APK"], "size": int(e["SIZE"]), "sha256": e["SHA"], "notes": notes}, ensure_ascii=False))
          ' > update.json
          cat update.json
          gh release create "$tag" "$apk" update.json --target "$GITHUB_SHA" --title "ExileForge ${tag#v}" --notes-file RELEASE_NOTES.md --latest
      # Сервер с новым API ждёт этот релиз (1.81.5): опубликовали - запускаем его деплой, он выкатит проверенный образ
      # головы рабочей ветки сервера. SERVER_DEPLOY_TOKEN - токен с Actions: write на ktor-bestgame.
      - if: steps.version.outputs.exists == 'false'
        name: Trigger the server deploy
        env:
          GH_TOKEN: ${{ secrets.SERVER_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::SERVER_DEPLOY_TOKEN is missing: run the server deploy by hand if its API waited for this release"; exit 0; fi
          gh workflow run deploy.yml -R Sperance/ktor-bestgame --ref claude/tender-pasteur-a36kj2
      # Карта R8 (3.84.2): стеки из журнала запуска расшифровываются ею. Не в релизе для игроков - артефактом прогона.
      - if: steps.version.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.tag }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90
